name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.3.0 (leading v optional). Leave empty to release the version already in module.json."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          input='${{ inputs.version }}'
          input="${input#v}"
          input="$(printf '%s' "$input" | tr -d '[:space:]')"
          if [ -n "$input" ]; then
            version="$input"
          else
            version="$(jq -r '.version' module.json)"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid version '$version' (expected e.g. 0.3.0 or 0.3.0-beta.1)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Fail if the tag already exists
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists — pick a new version."
            exit 1
          fi

      - name: Bump module.json on the branch if the version changed
        run: |
          version='${{ steps.version.outputs.version }}'
          current="$(jq -r '.version' module.json)"
          if [ "$current" = "$version" ]; then
            echo "module.json is already at $version — no bump commit needed."
            exit 0
          fi
          tmp=$(mktemp)
          jq --arg v "$version" '.version = $v' module.json > "$tmp"
          mv "$tmp" module.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$version"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Pin manifest and download URLs (packaged copy only)
        run: |
          repo_url="${{ github.server_url }}/${{ github.repository }}"
          tag='${{ steps.version.outputs.tag }}'
          tmp=$(mktemp)
          jq \
            --arg url "$repo_url" \
            --arg manifest "$repo_url/releases/latest/download/module.json" \
            --arg download "$repo_url/releases/download/$tag/module.zip" \
            '.url = $url | .manifest = $manifest | .download = $download' \
            module.json > "$tmp"
          mv "$tmp" module.json
          jq . module.json

      - name: Package module.zip
        run: |
          zip -r module.zip \
            module.json \
            scripts \
            styles \
            templates \
            lang \
            LICENSE \
            README.md

      - name: Create the GitHub release and tag the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' \
            module.json \
            module.zip \
            --target "$(git rev-parse HEAD)" \
            --title '${{ steps.version.outputs.tag }}' \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}
